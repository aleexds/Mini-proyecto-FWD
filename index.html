<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión</title>
</head>
<body>

  <div class="login-container">
    <h1>Iniciar Sesión</h1>

    <!-- El compañero que hace el JS debe escuchar el evento "submit" de este form -->
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" placeholder="Ingresá tu usuario" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Ingresá tu contraseña" required>
      </div>

      <!-- Este párrafo empieza oculto. El JS lo debe mostrar cuando las
           credenciales sean incorrectas, cambiando su texto y quitando "hidden" -->
      <p id="errorMsg" class="error-message hidden">Usuario o contraseña incorrectos</p>

      <button type="submit" id="loginBtn">Ingresar</button>
    </form>
  </div>
</body>
</html>
