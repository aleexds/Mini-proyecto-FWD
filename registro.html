<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js@1.12.0/src/toastify.min.css">
</head>
<body class="registro-page">
  <div class="login-container">

    <div class="regis-visual" style="background-image:url('descarga.jpg')">
      <div class="login-visual-content">
        <h2 class="login-visual-title">Join Our<br>Network</h2>
        <p class="login-visual-text">Registrá tus datos para acceder al panel de control y gestionar tus operaciones.</p>
      </div>
      <span class="login-visual-badge">NEW ACCOUNT</span>
    </div>

    <div class="login-panel">
      <div class="login-panel-inner">
        <div class="login-brand">
          <div class="login-brand-logo">
            <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="20" cy="20" r="17" stroke="currentColor" stroke-width="1.4" opacity="0.35"/>
              <path d="M20 6a14 14 0 0 1 14 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <circle cx="34" cy="20" r="2.2" fill="currentColor"/>
              <path d="M14 27 L20 13 L26 27" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M16.3 21.5h7.4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            </svg>
          </div>
          <p class="login-brand-name">Stellarix</p>
          <p class="login-brand-tagline">Innovando el futuro de la tecnología aeroespacial</p>
        </div>

        <h1>Registro de Clientes</h1>

        <form id="registroForm" novalidate>
          <div class="form-group">
            <label for="nombre">Nombre</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M4 20c1.5-3.5 4.7-5.5 8-5.5s6.5 2 8 5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <input type="text" id="nombre" name="nombre" placeholder="Ingresá tu nombre" autocomplete="given-name" required>
            </div>
          </div>

          <div class="form-group">
            <label for="apellido">Apellido</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M4 20c1.5-3.5 4.7-5.5 8-5.5s6.5 2 8 5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <input type="text" id="apellido" name="apellido" placeholder="Ingresá tu apellido" autocomplete="family-name" required>
            </div>
          </div>

          <div class="form-group">
            <label for="usuario">Usuario</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M4 20c1.5-3.5 4.7-5.5 8-5.5s6.5 2 8 5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <input type="text" id="usuario" name="usuario" placeholder="Elegí un nombre de usuario" autocomplete="username" required>
            </div>
          </div>

          <div class="form-group">
            <label for="email">Correo electrónico</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/>
                <path d="m3 7 9 6 9-6" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
              </svg>
              <input type="email" id="email" name="email" placeholder="nombre@correo.com" autocomplete="email" required>
            </div>
          </div>

          <div class="form-group">
            <label for="telefono">Teléfono</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <input type="tel" id="telefono" name="telefono" placeholder="Ingresá tu teléfono" autocomplete="tel" required>
            </div>
          </div>

          <div class="form-group">
            <label for="direccion">Dirección</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                <circle cx="12" cy="10" r="3" stroke="currentColor" stroke-width="1.6"/>
              </svg>
              <input type="text" id="direccion" name="direccion" placeholder="Ingresá tu dirección" autocomplete="street-address">
            </div>
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="5" y="10.5" width="14" height="9.5" rx="2" stroke="currentColor" stroke-width="1.6"/>
                <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
              <input type="password" id="password" name="password" placeholder="Creá una contraseña" autocomplete="new-password" required>
            </div>
          </div>

          <button type="submit" id="loginBtn">Registrarme</button>
        </form>

        <p class="login-footer"><a href="index.html">¿Ya tenés cuenta? Iniciá sesión</a></p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/toastify-js@1.12.0/src/toastify.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
